version: '3.8'

services:
  # PostgreSQL 데이터베이스 (관계형 데이터)
  postgres:
    image: postgres:15-alpine
    container_name: matchit_postgres
    environment:
      POSTGRES_DB: matchit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount a single SQL init script so the container only executes the one intended file
      # If you want multiple files to be executed, you can mount a directory instead.
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - matchit_network
    restart: unless-stopped

  # pgAdmin (PostgreSQL 관리 도구)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matchit_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matchit.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_LOGIN_BANNER: "'MatchIT PostgreSQL 관리 도구'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - matchit_network
    restart: unless-stopped

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: matchit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - matchit_network
    restart: unless-stopped

  # Backend 서버
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: matchit_server
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - matchit_network
    restart: unless-stopped

  # Frontend 클라이언트
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchit_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # 컨테이너 내부 node_modules는 호스트와 분리
    depends_on:
      - server
    networks:
      - matchit_network
    restart: unless-stopped
    command: npm start  # 개발 모드에서 실행 명확히 지정

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  matchit_network:
    driver: bridge
